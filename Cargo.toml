[package]
name = "signal-wasm"
version = "0.6.6"
edition = "2021"
description = "Signal Protocol compiled to WebAssembly for browser-based E2EE messaging"
license = "AGPL-3.0-only"
repository = "https://github.com/getmaapp/signal-wasm"
keywords = ["signal", "encryption", "e2ee", "wasm", "cryptography"]
categories = ["cryptography", "wasm"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# WASM bindings — exact-pinned (2026-08-12, L23): mirrors the npm/pod
# exact-pin discipline; versions are the Cargo.lock-resolved ones.
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"
js-sys = "=0.3.103"
web-sys = { version = "=0.3.103", features = ["console", "Window", "Performance"] }
console_error_panic_hook = "=0.1.7"


# Core libsignal crates (git dependencies for independent build)
# Pinned to libsignal v0.101.0 @ b056faa6d (2026-08-19), workspace version 0.101.0.
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", rev = "b056faa6dd02961cff24064c54c089c52e1a0753" }
zkgroup = { git = "https://github.com/signalapp/libsignal", rev = "b056faa6dd02961cff24064c54c089c52e1a0753" }

# Randomness for browser (uses Web Crypto API)
# We need both v0.2 and v0.3 due to a "diamond dependency" in the upstream libsignal ecosystem:
# 1. getrandom v0.2 is required by `aes-gcm-siv` (v0.11.1), which depends on `rand_core` v0.6.
#    (curve25519-dalek left this side of the diamond at v0.100.0: upstream moved from the
#    signalapp 4.1.3 fork to crates-io v5.0, which uses `rand_core` v0.10 — no getrandom.)
# 2. getrandom v0.3 is required by the libsignal crates via `rand` v0.9 / `rand_core` v0.9.
#    (uuid v1.24 moved on: getrandom v0.4 off-wasm, wasm-bindgen directly on wasm32.)
# Removing either will cause compilation failures on wasm32.
getrandom_v02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
getrandom = { version = "=0.3.4", features = ["wasm_js"] }


# UUID handling (v5 was dropped in 0.4.0 with the removal of `map_group_id`)
uuid = { version = "=1.24.0", features = ["v4", "serde", "js"] }

# For zeroising secrets
zeroize = { version = "=1.9.0", features = ["derive"] }

# Random number generation
rand = { version = "=0.9.5" }

# Constant-time comparisons
subtle = "=2.6.1"

# Async trait support for the wrapper's own `SenderKeyStore` implementation
# (matches the version pinned by libsignal's workspace).
async-trait = "=0.1.89"

[dev-dependencies]
wasm-bindgen-test = "=0.3.76"
# For PQXDH base-key boundary tests: the same curve25519-dalek release line the
# libsignal v0.100.0 workspace uses (upstream moved from the signalapp 4.1.3
# fork to crates-io 5.0; the [patch.crates-io] pin was dropped with the re-pin).
curve25519-dalek = { version = "=5.0.0", features = ["digest"] }

# Security-focused lints (note: cannot use workspace.lints with overrides)
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
# Optimise for small binary size
lto = true
opt-level = "s"
debug = 0
panic = "abort"

[profile.dev]
# Faster dev builds
opt-level = 1
debug = 2
panic = "unwind"

